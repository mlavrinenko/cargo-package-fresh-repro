on: [push, workflow_dispatch]

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.90.0", "1.91.0", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build
      - run: cargo package
      - run: sed -i s/before/after/ src/main.rs
      - run: cargo build -v
      - run: test "$(./target/debug/fresh-after-package)" = after
